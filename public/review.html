<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get a quote – Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f5;--ink:#0b1714;--muted:#5f6b67;--faint:#c9cfcd;--line:#e3e6e4;
    --green:#08443a;--green-2:#0d5547;--red:#c8282d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg)}
  body{font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{width:100%;max-width:780px;margin:0 auto;padding:30px 0 80px}

  .crumbs{display:flex;align-items:center;gap:8px}
  .crumb{display:inline-flex;align-items:center;height:26px;padding:0 10px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:9.5px;font-weight:600;color:var(--ink);text-decoration:none}
  .crumb-sep{font-size:10px;color:var(--faint)}

  .main{width:480px;margin-left:auto;padding-top:44px}

  .stepper{display:flex;align-items:flex-start;margin-bottom:28px}
  .step{display:flex;flex-direction:column;align-items:center;gap:6px}
  .step .dot{width:6px;height:6px;border-radius:50%;background:#dfe3e1;margin-top:3px}
  .step.done .dot{background:var(--green)}
  .step.current .dot{width:12px;height:12px;margin-top:0;background:var(--green);box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px #cfd6d3}
  .step span{font-size:8.5px;font-weight:500;color:#c3cac7;white-space:nowrap}
  .step.done span{color:var(--ink)}
  .step.current span{color:var(--ink);font-weight:600}
  .bar{height:1.5px;width:32px;background:#e3e6e4;margin:5.5px 4px 0;flex:none}
  .bar.done{background:var(--green)}

  h1{font-size:37px;line-height:1.02;font-weight:800;letter-spacing:-0.045em}
  .sub{font-size:11.5px;color:var(--muted);margin-top:4px}

  /* price box */
  .quote{margin-top:22px;background:var(--green);color:#fff;border-radius:16px;padding:18px 18px 16px;box-shadow:0 14px 30px rgba(8,68,58,.22)}
  .quote .lab{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.7)}
  .quote .big{display:flex;align-items:baseline;gap:8px;margin-top:4px}
  .quote .big .amt{font-size:30px;font-weight:800;letter-spacing:-0.03em}
  .quote .big .was{font-size:13px;color:#ff9c9c;text-decoration:line-through}
  .quote .per{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}

  /* summary */
  .card{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .item{display:flex;align-items:flex-start;gap:14px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .item .k{flex:0 0 118px;font-size:11px;color:var(--muted);padding-top:1px}
  .item .v{font-size:12.5px;font-weight:600;text-align:right;overflow-wrap:anywhere}
  .item a.edit{font-size:10.5px;font-weight:600;color:var(--green);text-decoration:underline;white-space:nowrap}
  .vwrap{flex:1;display:flex;flex-direction:column;align-items:flex-end;gap:3px}

  .terms{margin-top:16px;display:flex;gap:9px;align-items:flex-start}
  .terms input{margin-top:2px;width:15px;height:15px;accent-color:var(--green);flex:none}
  .terms label{font-size:10.5px;color:var(--muted);line-height:1.45}
  .err{display:none;margin-top:8px;font-size:9.5px;color:var(--red)}
  .err.show{display:block}

  .actions{margin-top:22px;display:flex;align-items:center;gap:10px}
  .back{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
  .back:hover{border-color:#cfd5d2}
  .next{height:38px;padding:0 28px;border:none;border-radius:999px;background:var(--green);color:#fff;font:inherit;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;cursor:pointer;box-shadow:0 12px 26px rgba(8,68,58,.22);transition:background .15s}
  .next:hover{background:var(--green-2)}

  .done-msg{display:none;margin-top:16px;background:#e8f5ef;border:1px solid #bfe3d3;border-radius:12px;padding:14px 15px;font-size:12px;color:#0b4a3a}
  .done-msg.show{display:block}

  @media (max-width:820px){.wrap{padding:24px 16px 60px}.main{width:100%;padding-top:32px}}
</style>
</head>
<body>
  <div class="wrap">
    <nav class="crumbs">
      <a class="crumb" href="index.html">Home</a>
      <span class="crumb-sep">/</span>
      <a class="crumb" href="cover.html">Get a quote</a>
    </nav>

    <main class="main">
      <div class="stepper">
        <div class="step done"><i class="dot"></i><span>Vehicle</span></div>
        <div class="bar done"></div>
        <div class="step done"><i class="dot"></i><span>Cover</span></div>
        <div class="bar done"></div>
        <div class="step done"><i class="dot"></i><span>About you</span></div>
        <div class="bar done"></div>
        <div class="step done"><i class="dot"></i><span>Address</span></div>
        <div class="bar done"></div>
        <div class="step current"><i class="dot"></i><span>Review</span></div>
      </div>

      <h1>Review your quote</h1>
      <p class="sub">Check everything looks right before you confirm.</p>

      <div class="quote">
        <div class="lab">Your price</div>
        <div class="big"><span class="amt" id="amt">—</span><span class="was" id="was"></span></div>
        <div class="per" id="per">Includes 10% introductory discount</div>
      </div>

      <div class="card" id="summary"></div>

      <div class="terms">
        <input type="checkbox" id="agree">
        <label for="agree">I confirm the details above are correct and I've read the policy terms.</label>
      </div>
      <p class="err" id="err">Please confirm your details to continue.</p>

      <div class="done-msg" id="doneMsg">✓ Thanks! This is where payment would come next. Your demo quote is complete.</div>

      <div class="actions">
        <button type="button" class="back" aria-label="Back" onclick="history.back()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M7.5 2.5L4 6l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="next" id="confirm">
          Confirm &amp; pay
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6.5 2.5L10 6l-3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </main>
  </div>

<script>
  const g = k => localStorage.getItem(k) || '';

  const COVER = {
    '1h': {label:'1 hour',  now:'£2.66',  was:'£2.95'},
    '1d': {label:'1 day',   now:'£17.99', was:'£19.99'},
    '1w': {label:'1 week',  now:'£89.99', was:'£99.99'},
    'custom': {label:'Custom dates', now:'TBC', was:''}
  };
  const LICENCE = {full_uk:'Full UK licence', international:'International licence', learner:'Learner licence'};

  // price box
  const c = COVER[g('q_cover')] || {label:'—', now:'—', was:''};
  document.getElementById('amt').textContent = c.now;
  document.getElementById('was').textContent = c.was;

  // date formatting dd/mm/yyyy
  function fmtDate(iso){
    if(!iso) return '—';
    const p = iso.split('-');
    return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso;
  }

  // address assembled
  const addrBits = [g('q_line1'), g('q_line2'), g('q_town'), g('q_county'), g('q_postcode')].filter(Boolean);
  const addr = addrBits.length ? addrBits.join(', ') : '—';

  const vehVal = g('q_reg') ? (g('q_reg') + (g('q_vehicle') ? ' · ' + g('q_vehicle') : '')) : '—';
  const rows = [
    {k:'Vehicle', v:vehVal, go:'vehicle.html'},
    {k:'Cover length', v:c.label, go:'cover.html'},
    {k:'Name', v:g('q_name')||'—', go:'about-you.html'},
    {k:'Date of birth', v:fmtDate(g('q_dob')), go:'date-of-birth.html'},
    {k:'Licence', v:LICENCE[g('q_licence')]||'—', go:'licence-type.html'},
    {k:'Email', v:g('q_email')||'—', go:'email.html'},
    {k:'Address', v:addr, go:'address.html'},
    {k:'Car photo', v:(g('q_photo') ? 'Added \u2713' : 'Not added'), go:'vehicle.html'}
  ];

  document.getElementById('summary').innerHTML = rows.map(r =>
    `<div class="item"><span class="k">${r.k}</span>`+
    `<span class="vwrap"><span class="v">${r.v}</span>`+
    `<a class="edit" href="${r.go}">Edit</a></span></div>`
  ).join('');

  // confirm
  const agree = document.getElementById('agree');
  const err = document.getElementById('err');
  const done = document.getElementById('doneMsg');
  agree.addEventListener('change', () => err.classList.remove('show'));
  const btn = document.getElementById('confirm');
  btn.addEventListener('click', async () => {
    if(!agree.checked){ err.classList.add('show'); return; }
    const payload = {
      email: g('q_email'), name: g('q_name'), reg: g('q_reg'),
      vehicle: vehVal, cover: c.label, coverCode: g('q_cover'), dob: fmtDate(g('q_dob')),
      licence: (LICENCE[g('q_licence')] || ''), address: addr, price: c.now, photo: g('q_photo'),
      make: g('q_make'), model: g('q_model'), year: g('q_year'), vin: g('q_vin'), colour: g('q_colour')
    };
    const label = btn.innerHTML;
    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      const r = await fetch('/api/policy', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      const j = await r.json();
      if(!r.ok) throw new Error(j.error || 'Something went wrong');
      done.innerHTML = j.demo
        ? '✓ Demo: this is where payment would happen. Email sending is not set up yet (add BREVO_API_KEY and SENDER_EMAIL in .env).'
        : ('✓ Done! Your policy has been emailed to <b>' + (payload.email || '') + '</b>' + (j.policy ? ' — policy ' + j.policy : '') + '.');
      done.classList.add('show');
      done.scrollIntoView({behavior:'smooth', block:'center'});
    } catch(e) {
      done.innerHTML = '⚠ ' + e.message;
      done.classList.add('show');
    } finally {
      btn.disabled = false; btn.innerHTML = label;
    }
  });
</script>
</body>
</html>
